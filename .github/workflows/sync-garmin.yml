name: 🦾 每日 Garmin 數據同步

on:
  schedule:
    - cron: '0 0 * * *'→ Runs at 00:00
    - cron: '0 13 * * *'→ Runs at 13:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "📦 Install dependencies"
        run: pip install -r requirements.txt

      - name: "🔍 Diagnose garminconnect"
        run: |
          python3 -c "import garminconnect; print('version:', getattr(garminconnect, '__version__', 'N/A'))"
          python3 -c "from garminconnect import Garmin, GarminConnectConnectionError, GarminConnectTooManyRequestsError; print('imports OK')"

      - name: "🏃 Fetch all members' Garmin data"
        env:
          GARMIN_EMAIL_KAREN:   ${{ secrets.GARMIN_EMAIL_KAREN }}
